<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minha-lista-site.com.br</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Topo feito exatamente com a sua imagem Divulgação.png e a barra de pesquisa logo abaixo -->
    <header class="topo-site">
        <div class="imagem-topo-container">
            <img src="Divulgação.png" alt="Minhas Criações e Redes" class="img-divulgacao">
        </div>
        
        <div class="barra-pesquisa-container">
            <span class="icone-lupa">🔍</span>
            <input type="text" id="campoPesquisa" placeholder="Pesquisar" onkeyup="filtrarSites()">
        </div>
    </header>

    <!-- Área da Caixa Amarela de Aviso -->
    <main class="conteudo-principal" id="conteudoPrincipal">
        <!-- Inserido dinamicamente pelo JS -->
    </main>

    <!-- Tela Inteira (Frame do Site Selecionado quando você criar) -->
    <div id="visualizadorSite" class="visualizador-overlay" style="display: none;">
        <div class="barra-topo-frame">
            <span id="tituloSiteAtivo" class="titulo-site-ativo"></span>
            <button onclick="fecharSite()" class="botao-fechar">✖ Fechar / Voltar</button>
        </div>
        <div class="frame-container">
            <iframe id="iframeProjeto" src=""></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
